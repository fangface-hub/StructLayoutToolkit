name: Build macOS App, Zip and Sign with Cosign (OIDC)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  build-sign-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set release tag from project version
        id: rel
        run: |
          ver=$(python -c "import pathlib,tomllib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8-sig'))['project']['version'])")
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "name=StructLayoutToolkit v$ver" >> "$GITHUB_OUTPUT"

      - name: Build with Nuitka
        run: |
          uv sync --group build --no-dev
          pwsh ./build_nuitka.ps1 -SkipUvSync

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign executable with OIDC
        run: cosign sign-blob --yes --output-signature dist/launcher.dist/StructLayoutToolkit.sig dist/launcher.dist/StructLayoutToolkit

      - name: Create ZIP
        run: |
          cd dist
          zip -r ../StructLayoutToolkit-macos.zip launcher.dist

      - name: Sign ZIP with OIDC
        run: cosign sign-blob --yes --output-signature StructLayoutToolkit-macos.zip.sig StructLayoutToolkit-macos.zip

      - name: Publish Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          draft: false
          prerelease: true
          overwrite_files: true
          files: |
            StructLayoutToolkit-macos.zip
            StructLayoutToolkit-macos.zip.sig
