[project]
name = "struct-layout-toolkit-launcher"
version = "1.0.0"
description = "Launcher for the StructLayoutToolkit binary and packet data editors"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "sltgui>=1.1.0",
]

[project.gui-scripts]
struct-layout-toolkit = "struct_layout_toolkit_launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
build = [
    "nuitka>=4.1.3",
]
dev = [
    "pytest>=9.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/struct_layout_toolkit_launcher"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]